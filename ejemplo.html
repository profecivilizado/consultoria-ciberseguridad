<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Informe de ejemplo · Operación Lupa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/comun.css">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<main class="wrap" id="view"></main>
<script src="datos/hugo.js"></script>
<script src="datos/dani.js"></script>
<script src="datos/nora.js"></script>
<script src="datos/marcos.js"></script>
<script src="datos/irene.js"></script>
<script src="js/comun.js"></script>
<script>
chrome();
const id = caseId();
setCrumb(id ? [[`Expediente ${CASOS[id].no}`, `expediente.html#${id}`], ["Informe de ejemplo"]] : [["Informe de ejemplo"]]);
$("#view").innerHTML = `<article class="doc panel"><span class="eyebrow">Ejemplo resuelto</span><h1 style="font-size:28px">Informe de ejemplo · Expediente 000 · Leo Sanz</h1><p class="notice" style="margin:0">Este caso es inventado y <b>no es ninguno de vuestros expedientes</b>. Sirve para que veáis cómo se responde y qué nivel se espera.</p><h2>El caso</h2><p style="margin:0">Leo Sanz, de 19 años, recibió un aviso: alguien había entrado en su correo desde Lisboa a la 1 de la madrugada. Leo no estaba en Lisboa, sino en un concierto en Valdemora.</p><p class="small" style="margin:0">Evidencias del ejemplo:</p><ul class="evl"><li><span class="ev">H1</span> Foro de ciclismo (2025): «Vendo mi bici antigua. Escribidme a leo.sanz@valmail.es».</li><li><span class="ev">R2</span> Picto: «Os presento a Rayo, mi primera bici de verdad ⚡ Me la regalaron por mis 18, en 2024».</li><li><span class="ev">R4</span> Picto, 11/10 a las 22:10, con ubicación: «En el Valdemora Rock hasta las 2 🎸».</li><li><span class="ev">A1</span> Foto original de R2: el GPS marca el garaje de su casa.</li><li><span class="ev">C1</span> Valmail: sin verificación en dos pasos. Pregunta de seguridad: «¿Nombre de tu primera bici?». Actividad: 12/10 · 01:15 · contraseña restablecida desde Lisboa.</li><li><span class="ev">C2</span> Picto: verificación en dos pasos activada. Actividad: 12/10 · 01:20 · intento desde Lisboa bloqueado.</li></ul><h2>1. Introducción</h2><p class="exa">Leo Sanz, de 19 años, recibió un aviso de que alguien había entrado en su correo desde Lisboa. En este informe analizo su huella digital, su perfil de Picto, los metadatos de sus fotos y sus cuentas para descubrir cómo ocurrió y cómo puede protegerse.</p><h2>2. Respuestas a las preguntas guiadas</h2><p style="margin:0">Dos ejemplos. Fijaos en la diferencia entre una respuesta floja y una buena:</p><div class="exq"><p class="qq"><b>R2</b> · ¿Qué datos personales revela esta publicación?</p><div class="bad"><span>Respuesta floja</span>Que tiene una bici.</div><div class="good"><span>Respuesta buena</span>En <b>R2</b>, Leo cuenta que su bici se llama <b>Rayo</b> y que se la regalaron al cumplir 18 años en 2024, así que <b>nació en 2006</b>. Son datos que mucha gente usa en contraseñas y preguntas de seguridad. Además, los metadatos de la foto (<b>A1</b>) revelan dónde guarda la bici: en el garaje de su casa.</div></div><div class="exq"><p class="qq"><b>C1</b> · ¿Cómo entró el atacante en el correo?</p><div class="bad"><span>Respuesta floja</span>Hackeándolo.</div><div class="good"><span>Respuesta buena</span>El 12/10 a la 01:15, el atacante restableció la contraseña de Valmail respondiendo a la pregunta de seguridad «¿Nombre de tu primera bici?» (<b>C1</b>). La respuesta, <b>Rayo</b>, estaba publicada en <b>R2</b>. Como Valmail no tiene la verificación en dos pasos, no hubo nada más que lo frenara.</div></div><div class="notice" style="margin:0"><b>Una respuesta buena:</b><ul style="margin:6px 0 0"><li><b>Cita el código</b> de la evidencia.</li><li>Da el <b>dato concreto</b> (nombres, fechas, horas), no una idea general.</li><li>Explica <b>por qué es un riesgo</b> o <b>cómo se relaciona</b> con otra evidencia.</li></ul></div><h2>3. ¿Qué ha pasado?</h2><div class="tplwrap"><table class="tpl ex"><tr><th>Fecha</th><th>Qué ocurrió</th><th>Evidencia</th></tr><tr><td>2024</td><td>Leo publica el nombre de su primera bici y cuándo se la regalaron.</td><td>R2</td></tr><tr><td>2025</td><td>Publica su correo en un foro de ciclismo.</td><td>H1</td></tr><tr><td>11/10 · 22:10</td><td>Publica en directo que estará en un concierto hasta las 2.</td><td>R4</td></tr><tr><td>12/10 · 01:15</td><td>El atacante restablece la contraseña del correo con la pregunta de seguridad.</td><td>C1</td></tr><tr><td>12/10 · 01:20</td><td>Intenta entrar en Picto, pero la verificación en dos pasos lo bloquea.</td><td>C2</td></tr></table></div><h2>4. Plan de protección</h2><div class="tplwrap"><table class="tpl ex"><tr><th>Problema encontrado</th><th>Evidencia</th><th>Qué debería hacer</th></tr><tr><td>La respuesta a su pregunta de seguridad está publicada.</td><td>R2 · C1</td><td>Cambiar la pregunta por una cuya respuesta no aparezca en sus redes, o recuperar la cuenta solo con el móvil.</td></tr><tr><td>Su correo no tiene verificación en dos pasos.</td><td>C1</td><td>Activarla. En Picto ya la tenía (C2) y fue justo lo que frenó al atacante.</td></tr><tr><td>Publica dónde está en tiempo real.</td><td>R4</td><td>Subir las fotos al volver y desactivar la ubicación en las publicaciones.</td></tr></table></div><p class="small" style="margin:0">En vuestro informe tienen que ser cinco problemas.</p><h2>5. Conclusión</h2><p class="exa">Lo más grave es que un solo dato publicado, el nombre de su bici, bastó para robarle el correo, y con el correo se pueden recuperar casi todas sus demás cuentas. En cambio, la verificación en dos pasos de Picto demuestra que funciona. Después de este caso, voy a revisar mis preguntas de seguridad y a activar la verificación en dos pasos en mi correo.</p></article>` + (id ? `<nav class="mnav"><a class="btn ghost" href="informe.html#${id}">‹ Volver al informe</a></nav>` : `<nav class="mnav"><a class="btn ghost" href="index.html">‹ Inicio</a></nav>`);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bienestar digital · Operación Lupa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/comun.css">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<main class="wrap" id="view"></main>
<script src="datos/hugo.js"></script>
<script src="datos/lucia.js"></script>
<script src="datos/dani.js"></script>
<script src="js/comun.js"></script>
<script>
toolPage("bienestar", (c, id, el) => {
 const w = c.wb, D = ["L", "M", "X", "J", "V", "S", "D"], max = 10, avg = w.days.reduce((a, b) => a + b, 0) / 7;
 const bars = w.days.map((v, i) => { const h = v / max * 150, x = 34 + i * 48; return `<rect x="${x}" y="${170 - h}" width="30" height="${h}" rx="4" fill="var(--accent)"/><text x="${x + 15}" y="${164 - h}" font-size="11" text-anchor="middle" fill="var(--ink)">${String(v).replace(".", ",")}</text><text x="${x + 15}" y="188" font-size="11" text-anchor="middle" fill="var(--muted)">${D[i]}</text>`; }).join("");
 const grid = [0, 2, 4, 6, 8, 10].map(v => `<line x1="28" x2="370" y1="${170 - v * 15}" y2="${170 - v * 15}" stroke="var(--line)"/><text x="22" y="${174 - v * 15}" font-size="10" text-anchor="end" fill="var(--muted)">${v}</text>`).join("");
 const maxApp = Math.max(...w.apps.map(a => a[1]));
 const hm = m => m >= 60 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")} min` : `${m} min`;
 el.innerHTML = `<div class="wb"><div class="panel chart"><div style="display:flex;gap:8px;align-items:center">${ev("B1")}<h3 style="margin:0">Tiempo de pantalla diario (horas)</h3></div>
 <p class="small" style="margin:2px 0 8px">${w.week} · media ${avg.toFixed(1).replace(".", ",")} h al día</p>
 <svg viewBox="0 0 380 196" role="img" aria-label="Horas de pantalla por día de la semana">${grid}${bars}</svg></div>
 <div class="panel"><div style="display:flex;gap:8px;align-items:center">${ev("B2")}<h3 style="margin:0">Aplicaciones más usadas (media diaria)</h3></div>
 <div class="apps" style="margin-top:10px">${w.apps.map(a => `<div><b style="font-weight:500">${a[0]}</b><span>${hm(a[1])}</span><i><b style="width:${a[1] / maxApp * 100}%"></b></i></div>`).join("")}</div></div></div>
 <div class="tiles">${w.tiles.map(t => `<div class="tl panel">${ev(t[0])}<b>${t[1]}</b><span>${esc(t[2])}</span></div>`).join("")}</div>`;
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Picto · Operación Lupa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/comun.css">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<main class="wrap" id="view"></main>
<script src="datos/hugo.js"></script>
<script src="datos/dani.js"></script>
<script src="js/comun.js"></script>
<script>
function postMedia(c, p) { return p.shot ? SHOT(p.shot[0], p.shot[1]) : photo(p.img + ".jpg", p.ph, (c.h + parseInt(p.c.slice(1)) * 41) % 360); }
toolPage("picto", (c, id, el) => {
 const p = c.pic, S = p.search;
 const accounts = S.decoys.slice(); accounts.splice(S.pos, 0, {target: true, user: c.picto, name: c.name, bio: p.bio, posts: p.posts, fol: p.fol});
 const head = (a, i) => `<div class="prow"><div class="av"><div class="in">${ini(a.name)}${a.target ? `<img src="img/${id}-avatar.jpg" alt="" onerror="this.remove()">` : ""}</div></div><div class="stats"><div><b>${a.posts}</b><span>publicaciones</span></div><div><b>${a.fol}</b><span>seguidores</span></div><div><b>${a.seg || p.seg}</b><span>seguidos</span></div></div></div>
  <div class="bio"><b>${esc(a.name)}</b>${esc(a.bio)}</div>`;
 const top = `<div class="ptop"><span class="plogo">pict<b>o</b></span><span style="flex:1"></span>`;
 function searchView(q) {
  el.innerHTML = `<div class="picto panel">${top}</div>
  <div class="psearch"><form id="pf" class="sbox" role="search"><input id="pq" type="search" placeholder="🔍 Buscar cuentas en Picto" aria-label="Buscar en Picto" autocomplete="off" value="${esc(q || "")}"><button class="btn" type="submit">Buscar</button></form><div id="pr"></div></div></div>`;
  const run = () => {
   const v = $("#pq").value.trim().toLowerCase().replace(/^@/, "").normalize("NFD").replace(/[̀-ͯ]/g, "");
   const out = $("#pr");
   if (!v) { out.innerHTML = `<p class="empty">Escribid el nombre de la persona y pulsad Buscar.</p>`; return; }
   if (!S.q.some(k => v.includes(k) || k.includes(v) && v.length >= 3)) { out.innerHTML = `<p class="empty">No se han encontrado cuentas para «${esc(v)}».</p>`; return; }
   out.innerHTML = `<p class="small" style="margin:0">${accounts.length} cuentas encontradas. ¿Cuál es la de ${c.short}?</p>` + accounts.map((a, i) => `<button class="msg" data-i="${i}"><span class="av sm"><span class="in" style="width:42px;height:42px;font-size:15px">${ini(a.name)}</span></span><span class="t"><b>@${esc(a.user)}</b><span>${esc(a.name)} · ${esc(a.bio.split("\n").join(" · "))}</span></span>${a.priv ? '<span class="small">🔒</span>' : ""}</button>`).join("");
   out.querySelectorAll(".msg").forEach(b => b.onclick = () => { const a = accounts[b.dataset.i]; a.target ? profileView() : decoyView(a); });
  };
  $("#pf").addEventListener("submit", e => { e.preventDefault(); run(); }); if (q) run();
  window._lastQ = () => $("#pq") && $("#pq").value;
 }
 let lastQ = "";
 function back() { return `<button class="linkish" id="bk" style="font-size:14px">‹ Volver a los resultados</button>`; }
 function decoyView(a) {
  lastQ = $("#pq").value;
  el.innerHTML = `<div class="picto panel">${top}<b style="font-size:14px">@${esc(a.user)}</b></div><div class="prof">${back()}${head(a)}${a.priv ? "" : '<div class="small">🌐 Cuenta pública</div>'}</div>
  ${a.priv ? `<div style="padding:30px 14px;text-align:center;border-top:1px solid var(--line)"><div style="font-size:28px">🔒</div><b>Esta cuenta es privada</b><p class="small" style="margin:4px 0 0">Solo sus seguidores pueden ver sus publicaciones.</p></div>`
   : `<div class="grid">${a.tiles.map(t => `<div class="tile" style="cursor:default"><div class="ph" style="--h:${t[1]}"><span><em>${t[0]}</em></span></div></div>`).join("")}</div>`}</div>`;
  $("#bk").onclick = () => searchView(lastQ);
 }
 function profileView() {
  lastQ = $("#pq") ? $("#pq").value : lastQ;
  el.innerHTML = `<div class="picto panel">${top}<b style="font-size:14px">@${c.picto}</b></div>
  <div class="prof">${back()}<div class="prow">${avatar(id)}<div class="stats"><div><b>${p.posts}</b><span>publicaciones</span></div><div><b>${p.fol}</b><span>seguidores</span></div><div><b>${p.seg}</b><span>seguidos</span></div></div></div>
  <div class="bio"><b>${c.name}</b>${esc(p.bio)}</div><div class="small">🌐 Cuenta pública</div>
  <div class="hl">${p.hl.map(h => `<div><i>${h[0]}</i>${h[1]}</div>`).join("")}</div></div>
  <div class="grid">${p.feed.map((q, i) => `<button class="tile" data-i="${i}" aria-label="Publicación ${q.c}">${ev(q.c)}${postMedia(c, q)}</button>`).join("")}</div></div>
  <div class="acct panel" style="max-width:560px;margin:14px auto 0"><div class="top"><span class="ic">⚙️</span><div class="nm"><b>Ajustes de privacidad</b><span>Vista de la auditoría · @${c.picto}</span></div>${ev(p.priv.c)}</div>${p.priv.rows.map(r => `<div class="toggle"><span>${r[0]}</span><span>${r[1]}</span></div>`).join("")}</div>`;
  $("#bk").onclick = () => searchView(lastQ);
  el.querySelectorAll(".tile").forEach(b => b.onclick = () => { const q = p.feed[b.dataset.i];
   openSheet(`<div class="hd">${ev(q.c)}${avatar(id, 1)}<div class="who"><b>${c.picto}</b>${q.loc ? `<small>📍 ${esc(q.loc)}</small>` : ""}</div>${X}</div>
   <div class="big">${postMedia(c, q)}</div><div class="pb"><div class="acts">♡ 💬 ↗</div>${q.likes ? `<b>${q.likes.toLocaleString("es-ES")} me gusta</b>` : ""}
   ${q.cap ? `<div class="cap"><b class="u">${c.picto}</b>${esc(q.cap)}</div>` : ""}${q.cm.map(x => `<div><b class="u">${esc(x[0])}</b>${esc(x[1])}</div>`).join("")}
   <div class="when">${q.date}</div></div>`, "Publicación " + q.c); });
 }
 searchView("");
});
</script>
</body>
</html>

<main class="wrap" id="view"></main>

<script>
chrome(); setCrumb([]);
$("#view").innerHTML = `<section class="hero"><span class="eyebrow">P4 · Consultoría de Ciberseguridad</span>
<h1>Dos expedientes. Dos misiones. Un informe de auditoría.</h1>
<p class="lead">La dirección del centro os ha contratado como consultores de ciberseguridad. Cada uno investigará el caso de una persona que sospecha que su identidad digital está comprometida. Seguid las preguntas guiadas de cada herramienta, apuntad las evidencias y explicad qué ha pasado.</p>
<div class="notice"><b>Antes de empezar:</b> no todas las evidencias indican un problema. Algunas publicaciones y archivos son completamente normales, y detectarlos también cuenta.</div></section>
<h2 style="font-size:20px">Elegid el expediente asignado</h2>
<div class="cases">${Object.entries(CASOS).map(([id, c]) => `<a class="case panel" href="expediente.html#${id}">${avatar(id, 1)}<span class="no">EXPEDIENTE ${c.no}</span><h2>${c.name}</h2><p>${esc(c.hook)}</p><span class="go">Abrir expediente ›</span></a>`).join("")}</div>
<div class="homegrid"><section><h2 style="font-size:20px">Cómo se trabaja</h2><div class="steps">
 <div><b>1. Investigad</b>Haced las herramientas en orden: CyberSearch, Picto, Archivos y Panel de cuentas.</div>
 <div><b>2. Anotad</b>Cada evidencia lleva un código amarillo, como ${ev("R3")}. Apuntad los códigos en vuestras notas.</div>
 <div><b>3. Responded</b>Debajo de cada herramienta hay preguntas guiadas. Respondedlas en orden mientras exploráis.</div>
 <div><b>4. Entregad</b>Cuando terminéis las misiones, completad el informe con la plantilla. <a href="informe.html">Ver el informe</a> · <a href="ejemplo.html">Ver un informe de ejemplo</a>.</div></div></section></div>`;
</script>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Informe · Operación Lupa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/comun.css">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<main class="wrap" id="view"></main>
<script src="datos/hugo.js"></script>
<script src="datos/dani.js"></script>
<script src="datos/nora.js"></script>
<script src="datos/marcos.js"></script>
<script src="datos/irene.js"></script>
<script src="js/comun.js"></script>
<script>
chrome();
const id = caseId(), c = id ? CASOS[id] : null;
setCrumb(id ? [[`Expediente ${c.no}`, `expediente.html#${id}`], ["Informe"]] : [["Informe"]]);
const T = (cols, rows) => `<div class="tplwrap"><table class="tpl"><tr>${cols.map(x => `<th>${x}</th>`).join("")}</tr>${Array.from({length: rows}, () => `<tr>${cols.map(() => `<td></td>`).join("")}</tr>`).join("")}</table></div>`;
$("#view").innerHTML = `<article class="doc panel"><span class="eyebrow">P4 · Entrega</span><h1 style="font-size:28px">Informe de auditoría${c ? " · " + c.name : ""}</h1>
<p style="margin:0">Copiad esta estructura en el documento APA del aula virtual y completadla. Cuando habléis de una evidencia, escribid su código (H1, R4, A1, C3…).</p>
<p class="notice" style="margin:0">¿Dudas sobre cómo responder? Mirad el <a href="ejemplo.html${id ? "#" + id : ""}">informe de ejemplo</a> resuelto con un caso inventado.</p>
<h2>1. Introducción</h2><p style="margin:0">En 3-5 líneas: quién es la persona, qué le ha pasado (lo tenéis en la ficha del expediente) y qué habéis investigado.</p>
<h2>2. Respuestas a las preguntas guiadas</h2><p style="margin:0">Haced un apartado por herramienta (CyberSearch, Picto, Archivos y Panel de cuentas). Copiad cada pregunta y respondedla debajo. Añadid una captura de las evidencias más importantes.</p>
<h2>3. ¿Qué ha pasado?</h2><p style="margin:0">Contad en orden lo que ocurrió, como si fuera una historia. Podéis empezar por la última pregunta del panel de cuentas.</p>${T(["Fecha", "Qué ocurrió", "Evidencia"], 4)}
<h2>4. Plan de protección</h2><p style="margin:0">Cinco problemas que habéis encontrado y qué debería hacer la persona para resolver cada uno.</p>${T(["Problema encontrado", "Evidencia", "Qué debería hacer"], 5)}
<h2>5. Conclusión</h2><p style="margin:0">En 3-5 líneas: ¿qué es lo más grave que habéis descubierto? ¿Qué habéis aprendido para vuestras propias redes?</p>
<h2>Entrega</h2><p style="margin:0">PDF en formato APA con el nombre <b style="font-family:var(--mono)">APELLIDOS_NOMBRE_EV1P4_INF.pdf</b>.</p>
<h2>Evaluación</h2><table><tr><td>Respuestas a las preguntas guiadas</td><td>40 %</td></tr><tr><td>Explicación de lo que ha pasado</td><td>20 %</td></tr><tr><td>Plan de protección</td><td>25 %</td></tr><tr><td>Presentación y claridad del informe</td><td>15 %</td></tr></table></article>
${id ? `<nav class="mnav"><a class="btn ghost" href="cuentas.html#${id}">‹ Panel de cuentas</a><a class="btn ghost" href="expediente.html#${id}">Volver al expediente</a></nav>` : ""}`;
</script>
</body>
</html>

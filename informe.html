<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Informe · Operación Lupa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/comun.css">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<main class="wrap" id="view"></main>
<script src="datos/hugo.js"></script>
<script src="datos/lucia.js"></script>
<script src="datos/dani.js"></script>
<script src="js/comun.js"></script>
<script>
chrome();
const id = caseId(), c = id ? CASOS[id] : null;
setCrumb(id ? [[`Expediente ${c.no}`, `expediente.html#${id}`], ["Informe"]] : [["Informe"]]);
const T = (cols, rows) => `<div class="tplwrap"><table class="tpl"><tr>${cols.map(x => `<th>${x}</th>`).join("")}</tr>${Array.from({length: rows}, (_, i) => `<tr>${cols.map((x, j) => `<td>${i === 0 && j === 0 ? "Ej.: …" : ""}</td>`).join("")}</tr>`).join("")}</table></div>`;
$("#view").innerHTML = `<article class="doc panel"><span class="eyebrow">P4 · Entrega</span><h1 style="font-size:28px">Informe de auditoría${c ? " · " + c.name : ""}</h1>
<p style="margin:0">Copiad esta estructura en el documento APA del aula virtual y completadla. Citad siempre el código de la evidencia.</p>
<h2>1. Introducción</h2><p style="margin:0">Quién es la persona auditada, qué le ha pasado y qué habéis investigado. Unas 5 líneas.</p>
<h2>2. Misión 1 · Ficha y riesgos</h2>${T(["Dato que se conoce", "Evidencia"], 3)}${T(["Evidencia", "Qué muestra", "Tipo de riesgo"], 3)}
<p class="small" style="margin:0">Tipos: seguridad física · privacidad · reputación · terceros · sin riesgo. Añadid un párrafo sobre lo que descubristeis al cruzar evidencias.</p>
<h2>3. Misión 2 · Qué ha pasado en sus cuentas</h2>${T(["Hecho comprobado", "Indicio", "No se puede confirmar"], 2)}
<p class="small" style="margin:0">Explicad la prueba de recuperación y el papel de las contraseñas y de la verificación en dos pasos.</p>
<h2>4. Misión 3 · Mensajes</h2>${T(["Mensaje", "Legítimo / fraudulento", "Pistas", "Dato público que lo hace creíble"], 2)}
<h2>5. Misión 4 · Plan de protección</h2>${T(["Prioridad", "Medida", "Qué riesgo o evidencia resuelve"], 3)}
<p class="small" style="margin:0">Incluid al menos una medida sobre hábitos de uso del móvil.</p>
<h2>6. Conclusión</h2><p style="margin:0">Valoración global de su seguridad, su privacidad y su bienestar digital, y la lección más importante que os lleváis. Unas 5 líneas.</p>
<h2>Entrega</h2><p style="margin:0">PDF en formato APA con el nombre <b style="font-family:var(--mono)">APELLIDOS_NOMBRE_EV1P4_INF.pdf</b>. Adjuntad capturas solo de las evidencias más importantes.</p>
<h2>Evaluación</h2><table><tr><td>Identificación de evidencias y riesgos</td><td>30 %</td></tr><tr><td>Análisis y justificación</td><td>30 %</td></tr><tr><td>Medidas de protección propuestas</td><td>25 %</td></tr><tr><td>Claridad y calidad del informe</td><td>15 %</td></tr></table></article>
${id ? `<nav class="mnav"><a class="btn ghost" href="bienestar.html#${id}">‹ Bienestar digital</a><a class="btn ghost" href="expediente.html#${id}">Volver al expediente</a></nav>` : ""}`;
</script>
</body>
</html>
